<!--index.html-->
{{ template "header.html" . }}

  <h1 class="mb-4">Articles</h1>
  <div class="list-group">
    {{ range .payload }}
      <a href="/article/view/{{ .ID }}" class="list-group-item list-group-item-action mb-2">
        <h5 class="mb-1 text-primary">{{ .Title }}</h5>
        <p class="mb-1 text-muted">{{ .Content }}</p>
      </a>
    {{ end }}
  </div>

{{ template "footer.html" . }}
